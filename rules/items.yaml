# Hand-authored item counter rules — ASSERTED, not measured. Edit freely;
# this file is the product, the engine just applies it.
#
# Shape of a rule:
#   - item: Black King Bar          # item name shown in the UI
#     trigger: Lion                 # hero name that triggers it (OpenDota
#                                   # localized name, case-insensitive)
#     side: enemy                   # "enemy" (default) or "ally" — save items
#                                   # key off having someone worth saving
#     severity: 3                   # 1 nice / 2 strong / 3 near-mandatory
#     reason: "..."                 # short, names the triggering hero
#     roles: [core]                 # optional; carry/mid/offlane/
#                                   # soft_support/hard_support or groups
#                                   # core/support; omitted = any role
#     verified_patch: "7.39"        # when this rule was last sanity-checked
#
# Update meta.current_patch when Dota patches; rules older than two minor
# patches get flagged stale in the UI (visible decay, not silent).
#
# Stacking is sublinear (1.0 / 0.6 / 0.4) — one Nullifier answers three
# enemies. Severity floor and 5-item display cap live in the engine.
# Expect silence in many games; that is correct.

